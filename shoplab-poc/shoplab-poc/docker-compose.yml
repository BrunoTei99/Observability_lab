name: shoplab

services:
  # ---------------------------------------------------------- dados
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: shoplab-clickhouse
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP (queries e consola web em /play)
      - "9363:9363"   # /metrics para o Prometheus
    volumes:
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---------------------------------------------------------- plataforma
  webapp:
    build: ./webapp
    container_name: shoplab-webapp
    environment:
      CH_HOST: clickhouse
      CH_USER: shoplab_app
      CH_PASSWORD: app123
    ports:
      - "8080:8000"   # loja em http://localhost:8080 e modo caos em /admin
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: shoplab-simulator
    environment:
      TARGET: http://webapp:8000
      USERS: 30           # utilizadores virtuais no pico de tráfego
      WAVE_MINUTES: 10    # duração de um ciclo de subida e descida do tráfego
    depends_on:
      webapp:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------- observabilidade
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shoplab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - kuma-secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: shoplab-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  alert-logger:
    image: python:3.12-slim
    container_name: shoplab-alert-logger
    command: ["python", "-u", "/app/alert_logger.py"]
    volumes:
      - ./alert-logger/alert_logger.py:/app/alert_logger.py:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shoplab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - clickhouse
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: shoplab-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock   # para monitorizar os contentores
    restart: unless-stopped

  kuma-setup:
    build: ./kuma-setup
    container_name: shoplab-kuma-setup
    environment:
      KUMA_URL: http://uptime-kuma:3001
      KUMA_USER: admin
      KUMA_PASSWORD: ShopLab2026!
    volumes:
      - kuma-secrets:/secrets
    depends_on:
      - uptime-kuma
    restart: on-failure

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
  kuma-secrets:
