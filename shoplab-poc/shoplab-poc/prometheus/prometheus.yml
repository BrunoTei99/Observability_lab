global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shoplab-webapp
    scrape_interval: 10s
    static_configs:
      - targets: ["webapp:8000"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: uptime-kuma
    scrape_interval: 20s
    static_configs:
      - targets: ["uptime-kuma:3001"]
    basic_auth:
      password_file: /etc/prometheus/secrets/uptime-kuma-api-key

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
